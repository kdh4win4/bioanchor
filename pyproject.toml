[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bioanchor"
version = "0.1.0"
description = "Autonomous scientific agent for Bayesian MCMC analysis with uncertainty quantification and decentralized provenance archiving"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
  {name = "Dohoon Kim", email = "dkim@promptgenix.org"}
]
keywords = ["arweave", "mcmc", "bayesian", "reproducibility", "bioinformatics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
arweave = ["arweave-python-client>=2.0"]
pymc    = ["pymc>=5.0", "arviz>=0.17"]
all     = ["bioanchor[arweave,pymc]"]

[project.scripts]
bioanchor = "bioanchor.cli:main"

[project.urls]
Homepage   = "https://github.com/kdh4win4/bioanchor"
Repository = "https://github.com/kdh4win4/bioanchor"

[tool.setuptools.packages.find]
where = ["."]
include = ["bioanchor*"]
